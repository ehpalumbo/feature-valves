plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'jacoco'
}

apply plugin: 'org.springframework.boot.aot'

jacoco {
    toolVersion = '0.8.15'
}

group = 'org.calipsoide'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = '25'
    targetCompatibility = '25'
}

repositories {
    mavenCentral()
}

dependencies {
    def springBootDependencies = platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    implementation springBootDependencies
    implementation('org.springframework.boot:spring-boot-starter-webflux')
    implementation('com.github.ben-manes.caffeine:caffeine')
    implementation('org.springframework:spring-context-support')
    implementation('org.eclipse.jgit:org.eclipse.jgit:7.7.1.202607240634-r')
    compileOnly springBootDependencies
    compileOnly('org.projectlombok:lombok')
    annotationProcessor springBootDependencies
    annotationProcessor('org.projectlombok:lombok')
    testImplementation('org.springframework.boot:spring-boot-starter-test')
    testImplementation('org.springframework.boot:spring-boot-webtestclient')
    testImplementation('io.projectreactor:reactor-test')
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        csv.required = false
        html.required = true
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

tasks.named('bootBuildImage') {
    imageName = "ehpalumbo/feature-valves:${project.version}"
    environment['BP_JVM_VERSION'] = '25'
    environment['BP_JVM_JLINK_ENABLED'] = 'true'
    environment['BP_SPRING_AOT_ENABLED'] = 'true'
    dependsOn tasks.named('processAot')
}

// Test AOT is only needed for GraalVM-native test runs; JVM image build only needs processAot.
tasks.named('processTestAot') {
    enabled = false
}
